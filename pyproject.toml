[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guard"
version = "1.0.0"
description = "Certified post-hoc correction for frozen models under missing modalities"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# only needed to re-run the host models; the method itself needs numpy alone
hosts = ["torch>=1.10", "pandas>=1.3", "scikit-learn>=1.0"]
drugban = ["dgl>=2.0", "dgllife>=0.3", "rdkit>=2022.3", "yacs", "prettytable"]
dev = ["pytest>=7", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
